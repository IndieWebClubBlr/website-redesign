<section id="newsletter">
  <header class="page-intro">
    <p class="eyebrow">Weekly digest</p>
    <h1>Newsletter</h1>
    <p class="lede">A short email with the best member writing. No noise.</p>
  </header>
  {{> nl-form.html }}
</section>

{{#has_archive}}
<section id="archive">
  <h2>Past Issues</h2>
  <ol class="link-list">
    {{#archive}}
    <li><a href="{{url}}">{{date}}</a></li>
    {{/archive}}
  </ol>
</section>
{{/has_archive}}
