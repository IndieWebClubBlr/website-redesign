<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="language" content="EN">
  <meta name="robots" content="index,follow">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>IndieWebClub Bangalore</title>

  <meta name="title" content="IndieWebClub Bangalore">
  <meta name="description" content="Website of the IndieWebClub Bangalore community">

  <link rel="icon" href="{{{site_url}}}favicon.svg">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_US">
  <meta property="og:url" content="{{{page_url}}}">
  <meta property="og:site_name" content="IndieWebClub Bangalore">

  <meta property="og:description" content="Website of the IndieWebClub Bangalore community">

  <meta name="google-site-verification" content="W9zo_09H7si4AyfH3mhx1dUCwhNjdI_QsT58UoybSqk" />

  <link rel="canonical" href="{{{page_url}}}">
  <link rel="alternate" type="application/atom+xml" title="All blogroll posts (only links)" href="{{{site_url}}}blogroll.atom">
  <link rel="alternate" type="application/atom+xml" title="Latest blogroll posts (with content)" href="{{{site_url}}}blogroll-latest.atom">
  <link rel="alternate" type="application/atom+xml" title="Week note posts" href="{{{site_url}}}blogroll-weeknotes.atom">
  <link rel="alternate" type="application/atom+xml" title="Events" href="{{{site_url}}}events.atom">
  <link rel="alternate" type="application/atom+xml" title="Topics" href="{{{site_url}}}topics.atom">
  <link rel="alternate" type="application/atom+xml" title="Writing Prompts" href="{{{site_url}}}prompts.atom">
  <link rel="stylesheet" href="/style.css">
  <script defer data-domain="blr.indiewebclub.org" src="https://stati.stic.earth/js/script.file-downloads.outbound-links.js"></script>
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/" aria-label="IndieWebClub Bangalore — home">
        <span>IndieWebClub</span>
        <span>Bangalore</span>
      </a>

      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="/events/" {{#nav_events}}aria-current="page"{{/nav_events}}>Events</a></li>
          <li><a href="/writings/" {{#nav_writings}}aria-current="page"{{/nav_writings}}>Writings</a></li>
          <li><a href="/members/" {{#nav_members}}aria-current="page"{{/nav_members}}>Members</a></li>
          <li><a href="/about/" {{#nav_about}}aria-current="page"{{/nav_about}}>About</a></li>
        </ul>
        <a class="button button--join" href="/whatsapp">Join us</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{{content}}}
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <a class="footer-badge" href="https://indieweb.org/">
        <img src="{{{site_url}}}indiewebcamp-button.svg" alt="IndieWeb" style="image-rendering:pixelated;">
      </a>
      <p>Last generated <time datetime="{{generated_date}}">{{generated_date}}</time></p>
      <ul class="footer-links">
        <li><a href="/coc/">Code of Conduct</a></li>
        <li><a href="/newsletter/">Newsletter</a></li>
        <li><a href="/blogroll.atom">RSS</a></li>
        <li><a href="https://github.com/IndieWebClubBlr/website/">Source</a></li>
      </ul>
    </div>
  </footer>
</body>

</html>
